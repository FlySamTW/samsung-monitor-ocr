<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung OCR - 失敗圖片清單</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #262626;
            border-radius: 8px;
            border: 1px solid #404040;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h1 {
            border-bottom: 1px solid #404040;
            padding-bottom: 15px;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats {
            margin-bottom: 20px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #4f46e5;
        }
        .btn:active {
            transform: translateY(1px);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        li:last-child {
            border-bottom: none;
        }
        .filename {
            font-family: monospace;
            background: #111;
            padding: 2px 6px;
            border-radius: 3px;
            color: #ef5350;
        }
        .reason {
            color: #9ca3af;
            font-size: 0.9em;
            margin-top: 4px;
        }
        .meta {
            font-size: 0.8em;
            color: #6b7280;
            margin-top: 2px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❌ 失敗圖片清單 <span id="count" style="font-size: 0.6em; background: #ef5350; padding: 2px 8px; border-radius: 12px; vertical-align: middle;">0</span> <span id="version-stamp" style="font-size:12px; color:#aaa; margin-left:10px; font-weight:normal;">Build: v_20:12:00</span></h1>
        
        <div class="stats">
            <span>以下列出所有從 <code>failed_files.json</code> 載入的失敗記錄：</span>
            <button class="btn" onclick="copyList()">📋 複製所有檔名</button>
        </div>

        <div id="content">
            <div class="loading">正在載入數據...</div>
        </div>
    </div>

    <script>
        let failedFiles = [];

        async function fetchData() {
            try {
                // [v12.0 Fix] Fetch from dedicated endpoint (List), not status (Object)
                const response = await fetch('/api/failed_records');
                failedFiles = await response.json();
                render();
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div style="color: #ef5350; text-align: center; padding: 20px;">
                        ⚠️ 無法連接後端 API<br>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        }

        function render() {
            const container = document.getElementById('content');
            const countEl = document.getElementById('count');
            
            countEl.textContent = failedFiles.length;

            if (failedFiles.length === 0) {
                container.innerHTML = '<div class="empty">✅ 目前沒有失敗記錄</div>';
                return;
            }

            const listHtml = failedFiles.map(file => `
                <li>
                    <div>
                        <div class="filename">${file.filename}</div>
                        <div class="reason">${file.reason}</div>
                        <div class="meta">時間: ${file.timestamp} | 類型: ${file.error_type}</div>
                    </div>
                </li>
            `).join('');

            container.innerHTML = `<ul>${listHtml}</ul>`;
        }

        function copyList() {
            if (failedFiles.length === 0) return;
            // 只複製檔名，每行一個
            const text = failedFiles.map(f => f.filename).join('\r\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ 已複製！';
                setTimeout(() => btn.innerHTML = originalText, 2000);
            }).catch(err => {
                alert('複製失敗: ' + err);
            });
        }

        // Auto-refresh every 5 seconds
        setInterval(fetchData, 5000);
        
        // Initial load
        fetchData();
    </script>
</body>
</html>
