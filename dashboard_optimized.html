<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung OCR 專業監控台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            padding: 8px;
            gap: 8px;
        }

        /* 頂部狀態條 - 極簡化 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
            height: 50px;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .status-panel {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-running { background: #00ff88; }
        .status-idle { background: #ffaa00; }
        .status-error { background: #ff4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        /* 主要區域 - 專注於圖片和思考過程 */
        .main-content {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 16px;
            height: 100%;
            min-height: 0;
        }

        /* 左側：圖片區域 - 最大化 */
        .image-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .upload-zone {
            background: linear-gradient(145deg, rgba(0, 255, 136, 0.1), rgba(0, 123, 255, 0.1));
            border: 2px dashed rgba(0, 255, 136, 0.4);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            min-height: 80px;
        }

        .upload-zone:hover {
            border-color: #00ff88;
            background: linear-gradient(145deg, rgba(0, 255, 136, 0.2), rgba(0, 123, 255, 0.2));
            transform: translateY(-2px);
        }

        .upload-zone.drag-over {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .upload-text {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #00ff88;
        }

        .upload-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
        }

        /* 圖片預覽區 - 超大化 */
        .image-preview {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            min-height: 400px;
            cursor: pointer;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .image-preview:hover img {
            transform: scale(1.02);
        }

        .image-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .progress-container {
            margin-top: 12px;
            display: none;
        }

        .progress-text {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #00ff88;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #007bff);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* 右側：LLM思考區 + 簡潔狀態 */
        .thinking-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* LLM思考過程區域 - 超大化 */
        .llm-thinking {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(0, 255, 136, 0.3);
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
        }

        .thinking-icon {
            font-size: 1.5rem;
            color: #00ff88;
            animation: thinking 2s infinite;
        }

        @keyframes thinking {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .thinking-title {
            font-size: 1.1rem;
            color: #00ff88;
            font-weight: 500;
        }

        .thinking-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .thinking-entry {
            margin-bottom: 8px;
            padding: 4px 0;
            border-left: 3px solid transparent;
            padding-left: 12px;
            transition: all 0.3s ease;
        }

        .thinking-entry.stage1 { 
            color: #66d9ef; 
            border-left-color: #66d9ef;
        }

        .thinking-entry.stage2 { 
            color: #a6e22e; 
            border-left-color: #a6e22e;
        }

        .thinking-entry.success { 
            color: #00ff88; 
            border-left-color: #00ff88;
        }

        .thinking-entry.error { 
            color: #ff4444; 
            border-left-color: #ff4444;
        }

        .thinking-entry.warning { 
            color: #ffaa00; 
            border-left-color: #ffaa00;
        }

        .thinking-entry.info { 
            color: #e0e0e0; 
            border-left-color: #666;
        }

        /* 簡潔狀態面板 */
        .status-mini {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .status-card {
            text-align: center;
            padding: 8px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #00ff88;
        }

        .status-label {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* 結果卡片 - 極簡化 */
        .results-section {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 123, 255, 0.1));
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .result-filename {
            font-size: 0.8rem;
            color: #00ff88;
            font-weight: 500;
        }

        .confidence {
            font-size: 0.7rem;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .result-data {
            font-size: 0.75rem;
            color: #e0e0e0;
        }

        /* 底部日誌 - 極簡化 */
        .footer {
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            padding: 12px 16px;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            font-size: 0.8rem;
        }

        .log-entry {
            margin: 2px 0;
            opacity: 0.8;
        }

        .log-entry.success { color: #00ff88; }
        .log-entry.error { color: #ff4444; }
        .log-entry.warning { color: #ffaa00; }
        .log-entry.info { color: #e0e0e0; }

        /* 1:1圖片彈窗 */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-container {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-image-wrapper {
            position: relative;
            overflow: auto;
            border: 3px solid #00ff88;
            border-radius: 12px;
            background: #000;
            max-width: 80vw;
            max-height: 75vh;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .modal-image {
            display: block;
            cursor: move;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .modal-controls {
            margin-top: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .zoom-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .zoom-btn:hover {
            background: rgba(0, 255, 136, 0.4);
            transform: scale(1.1);
        }

        .zoom-level {
            color: #00ff88;
            font-weight: 500;
            min-width: 60px;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: -50px;
            right: 0;
            background: linear-gradient(45deg, #ff4444, #cc0000);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3);
        }

        .file-input {
            display: none;
        }

        /* 響應式調整 */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            
            .thinking-section {
                flex-direction: row;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1:1圖片彈窗 -->
        <div class="image-modal" id="imageModal">
            <div class="modal-container">
                <button class="close-modal" onclick="closeImageModal()">✕ 關閉</button>
                <div class="modal-image-wrapper" id="modalImageWrapper">
                    <img class="modal-image" id="modalImage" draggable="false">
                </div>
                <div class="modal-controls">
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomImage(-0.1)">−</button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button class="zoom-btn" onclick="zoomImage(0.1)">+</button>
                        <button class="zoom-btn" onclick="resetZoom()">⌂</button>
                    </div>
                    <span style="color: #e0e0e0;">拖拽移動圖片 | 滾輪縮放</span>
                </div>
            </div>
        </div>

        <!-- 極簡頂部狀態條 -->
        <div class="header">
            <h1>🔬 Samsung OCR 智能分析台</h1>
            <div class="status-panel">
                <div class="status-item">
                    <div class="status-dot status-idle" id="statusDot"></div>
                    <span id="statusText">連線中...</span>
                </div>
                <div class="status-item" id="apiStatus">API: 檢查中...</div>
            </div>
        </div>

        <!-- 主要內容區域 -->
        <div class="main-content">
            <!-- 左側：圖片區域 -->
            <div class="image-section">
                <!-- 上傳區域 -->
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-text">📁 智能批量上傳</div>
                    <div style="font-size: 0.9rem; opacity: 0.8;">支援PNG, JPG, JPEG格式</div>
                    <div class="upload-buttons">
                        <button class="btn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">選擇檔案</button>
                        <button class="btn btn-secondary" onclick="event.stopPropagation(); document.getElementById('folderInput').click()">選擇資料夾</button>
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-text" id="progressText">處理中: 0/0</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>

                <input type="file" id="fileInput" class="file-input" accept="image/*" multiple onchange="handleImageUpload(event)">
                <input type="file" id="folderInput" class="file-input" webkitdirectory multiple onchange="handleFolderUpload(event)">

                <!-- 圖片預覽區 -->
                <div class="image-preview" id="imagePreview" onclick="openImageModal(event)">
                    <div class="image-placeholder">
                        <div style="font-size: 2rem; margin-bottom: 8px;">🖼️</div>
                        <div>點擊上傳圖片開始智能分析</div>
                        <div style="font-size: 0.9rem; opacity: 0.7; margin-top: 8px;">支援拖拽上傳</div>
                    </div>
                </div>
            </div>

            <!-- 右側：思考過程 + 狀態 -->
            <div class="thinking-section">
                <!-- LLM思考過程區域 -->
                <div class="llm-thinking">
                    <div class="thinking-header">
                        <div class="thinking-icon">🧠</div>
                        <div class="thinking-title">AI 兩階段推理過程</div>
                    </div>
                    <div class="thinking-content" id="thinkingContent">
                        <div class="thinking-entry info">系統初始化完成，等待圖片輸入...</div>
                        <div class="thinking-entry info">🔬 第一階段：場景類型判斷 (遠景/近景)</div>
                        <div class="thinking-entry info">🎯 第二階段：規格牌區域定位與裁切</div>
                        <div class="thinking-entry info">📋 第三階段：精準OCR識別與JSON輸出</div>
                    </div>
                </div>

                <!-- 簡潔狀態面板 -->
                <div class="status-mini">
                    <div class="status-grid">
                        <div class="status-card">
                            <div class="status-value" id="totalProcessed">-</div>
                            <div class="status-label">已處理</div>
                        </div>
                        <div class="status-card">
                            <div class="status-value" id="successRate">-%</div>
                            <div class="status-label">成功率</div>
                        </div>
                    </div>
                </div>

                <!-- 結果列表 -->
                <div class="results-section">
                    <div style="font-size: 0.9rem; color: #00ff88; margin-bottom: 8px;">🎯 識別結果</div>
                    <div id="resultsList">
                        <!-- 動態載入結果卡片 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部極簡日誌 -->
        <div class="footer" id="logArea">
            <div class="log-entry">🚀 系統啟動，準備開始智能分析...</div>
        </div>
    </div>

    <script>
        let currentData = {};
        let updateInterval = null;
        let currentZoom = 1;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            startPolling();
            setupDragAndDrop();
            setupImageModal();
            addLogEntry('🔗 正在連接OCR服務...', 'info');
        });

        // 設置圖片彈窗
        function setupImageModal() {
            const modalImage = document.getElementById('modalImage');
            const wrapper = document.getElementById('modalImageWrapper');

            // 拖拽功能
            modalImage.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                
                wrapper.scrollLeft -= dx;
                wrapper.scrollTop -= dy;
                
                dragStart = { x: e.clientX, y: e.clientY };
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // 滾輪縮放
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                zoomImage(delta);
            });

            // ESC關閉
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeImageModal();
                }
            });
        }

        // 打開圖片彈窗
        function openImageModal(event) {
            const imageElement = document.querySelector('#imagePreview img');
            if (!imageElement) return;

            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            
            modalImage.src = imageElement.src;
            modal.style.display = 'flex';
            
            currentZoom = 1;
            updateZoomLevel();
            
            event.stopPropagation();
        }

        // 關閉圖片彈窗
        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // 縮放圖片
        function zoomImage(delta) {
            currentZoom = Math.max(0.1, Math.min(5, currentZoom + delta));
            updateZoomLevel();
        }

        // 重置縮放
        function resetZoom() {
            currentZoom = 1;
            updateZoomLevel();
            
            const wrapper = document.getElementById('modalImageWrapper');
            wrapper.scrollLeft = 0;
            wrapper.scrollTop = 0;
        }

        // 更新縮放等級
        function updateZoomLevel() {
            const modalImage = document.getElementById('modalImage');
            const zoomLevel = document.getElementById('zoomLevel');
            
            modalImage.style.transform = `scale(${currentZoom})`;
            zoomLevel.textContent = `${Math.round(currentZoom * 100)}%`;
        }

        // 兩階段思考過程顯示
        function showThinkingStage(stage, message, type = 'info') {
            const content = document.getElementById('thinkingContent');
            const timestamp = new Date().toLocaleTimeString();
            
            const entry = document.createElement('div');
            entry.className = `thinking-entry ${stage} ${type}`;
            entry.innerHTML = `<span style="opacity: 0.7;">[${timestamp}]</span> ${message}`;
            
            content.appendChild(entry);
            content.scrollTop = content.scrollHeight;
            
            // 限制條目數量
            const entries = content.children;
            if (entries.length > 30) {
                entries[0].remove();
            }
        }

        // 創建結果卡片
        function createResultCard(result, index) {
            const confidence = Math.round((result.confidence || 0.8) * 100);
            
            return `
                <div class="result-card" onclick="loadImagePreview('${result.filename}')">
                    <div class="result-header">
                        <div class="result-filename">${result.filename}</div>
                        <div class="confidence">${confidence}%</div>
                    </div>
                    <div class="result-data">
                        型號: ${result.model || 'N/A'} | 價格: ${result.price || 'N/A'}
                    </div>
                </div>
            `;
        }

        // 處理圖片上傳
        async function handleImageUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) {
                addLogEntry('❌ 請選擇圖片檔案', 'error');
                return;
            }

            addLogEntry(`📤 開始批量分析: ${imageFiles.length} 張圖片`, 'info');
            
            // 顯示進度
            const container = document.getElementById('progressContainer');
            const text = document.getElementById('progressText');
            const fill = document.getElementById('progressFill');
            
            container.style.display = 'block';
            text.textContent = `處理中: 0/${imageFiles.length}`;
            fill.style.width = '0%';

            let successCount = 0;

            for (let i = 0; i < imageFiles.length; i++) {
                const file = imageFiles[i];
                
                try {
                    addLogEntry(`📄 分析第 ${i + 1}/${imageFiles.length} 張: ${file.name}`, 'info');
                    
                    // 第一階段：場景判斷
                    showThinkingStage('stage1', `🔬 第一階段：分析場景類型 - ${file.name}`, 'stage1');
                    
                    // 顯示當前處理的圖片
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const preview = document.getElementById('imagePreview');
                            preview.innerHTML = '';
                            img.style.maxWidth = '100%';
                            img.style.maxHeight = '100%';
                            img.style.objectFit = 'contain';
                            preview.appendChild(img);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);

                    // 第二階段：區域定位
                    setTimeout(() => {
                        showThinkingStage('stage2', `🎯 第二階段：定位規格牌區域並裁切`, 'stage2');
                    }, 800);

                    // 上傳到API
                    const formData = new FormData();
                    formData.append('image', file);
                    
                    const response = await fetch('http://localhost:5000/api/image', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        successCount++;
                        
                        // 第三階段：結果輸出
                        setTimeout(() => {
                            showThinkingStage('stage2', `📋 第三階段：精準OCR識別完成`, 'success');
                            if (result.model || result.price) {
                                showThinkingStage('stage2', `✅ JSON結果: {"型號":"${result.model || '未識別'}", "價格":"${result.price || '未識別'}", "黑屏":${result.blackscreen || false}}`, 'success');
                            }
                        }, 1200);
                        
                        addLogEntry(`✅ 分析完成: ${result.filename || file.name}`, 'success');
                        
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                } catch (error) {
                    addLogEntry(`❌ 分析失敗 ${file.name}: ${error.message}`, 'error');
                    showThinkingStage('stage1', `❌ 分析失敗: ${error.message}`, 'error');
                }
                
                // 更新進度
                const processed = i + 1;
                text.textContent = `處理中: ${processed}/${imageFiles.length}`;
                fill.style.width = `${(processed / imageFiles.length) * 100}%`;
                
                // 延遲避免API過載
                if (i < imageFiles.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }

            // 隱藏進度條
            setTimeout(() => {
                container.style.display = 'none';
            }, 3000);

            const summary = `📊 批量分析完成 - 成功: ${successCount}/${imageFiles.length}`;
            addLogEntry(summary, successCount === imageFiles.length ? 'success' : 'warning');
            
            event.target.value = '';
            setTimeout(fetchData, 1000);
        }

        // 處理資料夾上傳
        async function handleFolderUpload(event) {
            const files = Array.from(event.target.files);
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            
            addLogEntry(`📂 資料夾上傳: 發現 ${imageFiles.length} 張圖片`, 'info');
            
            if (imageFiles.length === 0) {
                addLogEntry('❌ 資料夾中沒有圖片檔案', 'error');
                return;
            }

            // 使用相同的上傳邏輯
            const fakeEvent = { target: { files: imageFiles, value: '' } };
            await handleImageUpload(fakeEvent);
        }

        // 載入圖片預覽
        async function loadImagePreview(filename) {
            if (!filename) return;
            
            try {
                const imageUrl = `http://localhost:5000/api/image/${encodeURIComponent(filename)}`;
                const img = new Image();
                img.onload = () => {
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = '';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '100%';
                    img.style.objectFit = 'contain';
                    preview.appendChild(img);
                };
                img.onerror = () => {
                    addLogEntry(`❌ 圖片載入失敗: ${filename}`, 'error');
                };
                img.src = imageUrl;
            } catch (error) {
                addLogEntry(`❌ 圖片載入錯誤: ${error.message}`, 'error');
            }
        }

        // 設置拖拽上傳
        function setupDragAndDrop() {
            const uploadZone = document.querySelector('.upload-zone');
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadZone.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                uploadZone.addEventListener(eventName, () => {
                    uploadZone.classList.add('drag-over');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadZone.addEventListener(eventName, () => {
                    uploadZone.classList.remove('drag-over');
                }, false);
            });

            uploadZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                const fakeEvent = { target: { files: files, value: '' } };
                handleImageUpload(fakeEvent);
            }, false);
        }

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 開始輪詢
        function startPolling() {
            fetchData();
            updateInterval = setInterval(fetchData, 3000);
        }

        // 獲取資料
        async function fetchData() {
            try {
                const response = await fetch('http://localhost:5000/api/status');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                currentData = data;
                updateUI(data);
                
                // 更新狀態
                document.getElementById('statusDot').className = 'status-dot ' + 
                    (data.stats?.is_running ? 'status-running' : 'status-idle');
                document.getElementById('statusText').textContent = 
                    data.stats?.is_running ? '處理中' : '待機';
                document.getElementById('apiStatus').textContent = 'API: 正常';
                
            } catch (error) {
                console.error('連線失敗:', error);
                document.getElementById('statusDot').className = 'status-dot status-error';
                document.getElementById('statusText').textContent = '連線失敗';
                document.getElementById('apiStatus').textContent = 'API: 失敗';
                addLogEntry(`❌ 連線失敗: ${error.message}`, 'error');
            }
        }

        // 更新UI
        function updateUI(data) {
            if (data.stats) {
                document.getElementById('totalProcessed').textContent = data.stats.total_processed || 0;
                document.getElementById('successRate').textContent = data.stats.success_rate ? `${data.stats.success_rate}%` : '-%';
            }

            // 更新結果列表
            if (data.recent_results && Array.isArray(data.recent_results)) {
                const container = document.getElementById('resultsList');
                container.innerHTML = data.recent_results.map((result, index) => 
                    createResultCard(result, index)
                ).join('');
            }
        }

        // 添加日誌條目
        function addLogEntry(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            
            // 限制日誌條目數量
            const entries = logArea.querySelectorAll('.log-entry');
            if (entries.length > 20) {
                entries[0].remove();
            }
        }

        // 頁面離開時停止輪詢
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
