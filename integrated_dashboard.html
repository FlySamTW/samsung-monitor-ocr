<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三星 OCR 整合儀表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1a2e 100%);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        /* 8:9 比例容器 */
        .container {
            width: 100vw;
            height: 100vh;
            aspect-ratio: 8/9;
            max-width: calc(100vh * 8/9);
            max-height: calc(100vw * 9/8);
            margin: auto;
            padding: 12px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        /* 頂部狀態欄 */
        .header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 16px;
            color: #00bcd4;
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            margin-top: 2px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-running { background: #4ade80; }
        .status-idle { background: #fbbf24; }
        .status-error { background: #ef4444; }

        /* 主要內容區域 */
        .main-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 12px;
            height: 100%;
            overflow: hidden;
        }

        /* 左側：監控 + 審核 */
        .left-panel {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
        }

        /* 右側：日誌 + 結果 */
        .right-panel {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 圖片監控區 */
        .image-monitor {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .current-image {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 0;
        }

        .current-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        /* 人工審核區 */
        .manual-review {
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .review-fields {
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group label {
            font-size: 10px;
            color: #aaa;
            min-width: 40px;
        }

        .field-group input,
        .field-group select {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 6px 8px;
            color: #fff;
            font-size: 11px;
        }

        .review-actions {
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #00bcd4;
            color: white;
        }

        .btn-primary:hover {
            background: #00acc1;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        /* 日誌區域 */
        .logs-container {
            padding: 12px;
            height: 100%;
            overflow: hidden;
        }

        .logs-content {
            height: 100%;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.3;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .logs-content::-webkit-scrollbar {
            width: 4px;
        }

        .logs-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .logs-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .log-entry {
            margin-bottom: 3px;
            word-break: break-word;
        }

        .log-timestamp {
            color: #666;
        }

        .log-success {
            color: #4ade80;
        }

        .log-error {
            color: #ef4444;
        }

        .log-warning {
            color: #fbbf24;
        }

        /* 結果列表 */
        .results-container {
            height: 100%;
            overflow: hidden;
        }

        .results-list {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .result-item {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .result-item.selected {
            background: rgba(0, 188, 212, 0.2);
            border-left: 3px solid #00bcd4;
        }

        .result-filename {
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-data {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            color: #aaa;
        }

        .result-badge {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 2px;
            font-size: 9px;
            font-weight: 500;
        }

        .badge-single {
            background: rgba(76, 222, 128, 0.2);
            color: #4ade80;
        }

        .badge-distant {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .badge-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* 響應式調整 */
        @media (max-width: 1200px) {
            .container {
                padding: 8px;
                gap: 8px;
            }
            
            .card-header {
                padding: 8px 12px;
            }
            
            .card-title {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂部狀態欄 -->
        <div class="header">
            <div class="logo">🖥️ 三星 OCR</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="stat-total">-</div>
                    <div class="stat-label">總數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="stat-processed" style="color: #4ade80;">-</div>
                    <div class="stat-label">已處理</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="stat-success" style="color: #00bcd4;">-</div>
                    <div class="stat-label">成功</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="stat-failed" style="color: #ef4444;">-</div>
                    <div class="stat-label">失敗</div>
                </div>
            </div>
            <div class="status-indicator">
                <div class="status-dot status-idle" id="status-dot"></div>
                <span id="status-text">等待中</span>
            </div>
        </div>

        <!-- 主要內容區域 -->
        <div class="main-content">
            <!-- 左側面板 -->
            <div class="left-panel">
                <!-- 圖片監控 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>🖼️</span>
                            <span>當前圖片</span>
                        </div>
                        <div style="font-size: 10px; color: #666;" id="current-filename">未選擇</div>
                    </div>
                    <div class="card-content">
                        <div class="image-monitor">
                            <div class="current-image" id="current-image">
                                <div style="color: #666; font-size: 12px;">等待圖片載入...</div>
                            </div>
                            <div class="image-info">
                                <div class="info-item">
                                    <span>分類:</span>
                                    <span id="current-category">-</span>
                                </div>
                                <div class="info-item">
                                    <span>型號:</span>
                                    <span id="current-model">-</span>
                                </div>
                                <div class="info-item">
                                    <span>價格:</span>
                                    <span id="current-price">-</span>
                                </div>
                                <div class="info-item">
                                    <span>黑屏:</span>
                                    <span id="current-blackscreen">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 人工審核 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>✏️</span>
                            <span>人工審核</span>
                        </div>
                        <div style="font-size: 10px; color: #666;">修正結果</div>
                    </div>
                    <div class="card-content">
                        <div class="manual-review">
                            <div class="review-fields">
                                <div class="field-group">
                                    <label>分類</label>
                                    <select id="review-category">
                                        <option value="單機">單機</option>
                                        <option value="遠景">遠景</option>
                                        <option value="不合格">不合格</option>
                                    </select>
                                </div>
                                <div class="field-group">
                                    <label>型號</label>
                                    <input type="text" id="review-model" placeholder="例: S27CG552EC" />
                                </div>
                                <div class="field-group">
                                    <label>價格</label>
                                    <input type="text" id="review-price" placeholder="例: 4990" />
                                </div>
                                <div class="field-group">
                                    <label>黑屏</label>
                                    <select id="review-blackscreen">
                                        <option value="false">否</option>
                                        <option value="true">是</option>
                                    </select>
                                </div>
                            </div>
                            <div class="review-actions">
                                <button class="btn btn-primary" onclick="submitCorrection()">
                                    ✅ 提交修正
                                </button>
                                <button class="btn btn-secondary" onclick="acceptResult()">
                                    👍 接受結果
                                </button>
                                <button class="btn btn-danger" onclick="skipImage()">
                                    ⏭️ 跳過圖片
                                </button>
                                <button class="btn btn-secondary" onclick="refreshData()">
                                    🔄 刷新資料
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側面板 -->
            <div class="right-panel">
                <!-- 系統日誌 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>📋</span>
                            <span>系統日誌</span>
                        </div>
                        <div style="font-size: 10px; color: #666;">即時監控</div>
                    </div>
                    <div class="card-content">
                        <div class="logs-container">
                            <div class="logs-content" id="logs-content">
                                <div class="log-entry">
                                    <span class="log-timestamp">[開始]</span> 
                                    系統初始化完成，等待連線...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 處理結果 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>📊</span>
                            <span>處理結果</span>
                        </div>
                        <div style="font-size: 10px; color: #666;" id="results-count">0 項目</div>
                    </div>
                    <div class="card-content">
                        <div class="results-container">
                            <div class="results-list" id="results-list">
                                <!-- 結果項目將在這裡動態生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局狀態
        let currentData = null;
        let selectedResult = null;
        let updateInterval = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('整合儀表板初始化...');
            startDataUpdates();
        });

        // 開始資料更新
        function startDataUpdates() {
            updateInterval = setInterval(fetchData, 1000); // 每秒更新
            fetchData(); // 立即獲取一次
        }

        // 獲取資料
        async function fetchData() {
            try {
                const response = await fetch('http://localhost:5000/api/status');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                currentData = data;
                updateUI(data);
                
                // 更新狀態指示器
                document.getElementById('status-dot').className = 'status-dot ' + 
                    (data.stats?.is_running ? 'status-running' : 'status-idle');
                document.getElementById('status-text').textContent = 
                    data.stats?.is_running ? '處理中' : '等待中';
                
            } catch (error) {
                console.error('資料獲取失敗:', error);
                addLogEntry(`❌ API 連接失敗: ${error.message}`, 'error');
                
                // 更新錯誤狀態
                document.getElementById('status-dot').className = 'status-dot status-error';
                document.getElementById('status-text').textContent = '連接錯誤';
            }
        }

        // 更新 UI
        function updateUI(data) {
            // 更新統計數據
            if (data.stats) {
                document.getElementById('stat-total').textContent = data.stats.total || 0;
                document.getElementById('stat-processed').textContent = data.stats.processed || 0;
                document.getElementById('stat-success').textContent = data.stats.success || 0;
                document.getElementById('stat-failed').textContent = data.stats.failed || 0;
            }

            // 更新當前圖片
            if (data.current_file) {
                updateCurrentImage(data.current_file);
                loadImagePreview(data.current_file);
            }

            // 更新日誌
            if (data.lm_logs && Array.isArray(data.lm_logs)) {
                updateLogs(data.lm_logs);
            }

            // 更新結果列表
            if (data.recent_results && Array.isArray(data.recent_results)) {
                updateResultsList(data.recent_results);
            }
        }

        // 更新當前圖片資訊
        function updateCurrentImage(filename) {
            document.getElementById('current-filename').textContent = filename || '未選擇';
            
            // 如果有選中的結果，顯示其資訊
            if (selectedResult) {
                document.getElementById('current-category').textContent = selectedResult.category || '-';
                document.getElementById('current-model').textContent = selectedResult.model || '-';
                document.getElementById('current-price').textContent = selectedResult.price || '-';
                document.getElementById('current-blackscreen').textContent = 
                    selectedResult.black_screen ? '是' : '否';
            }
        }

        // 載入圖片預覽
        async function loadImagePreview(filename) {
            if (!filename) return;
            
            try {
                const imageUrl = `http://localhost:5000/api/image/${encodeURIComponent(filename)}`;
                const img = new Image();
                img.onload = () => {
                    const imageContainer = document.getElementById('current-image');
                    imageContainer.innerHTML = '';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '100%';
                    img.style.objectFit = 'contain';
                    imageContainer.appendChild(img);
                };
                img.onerror = () => {
                    document.getElementById('current-image').innerHTML = 
                        '<div style="color: #ef4444; font-size: 12px;">圖片載入失敗</div>';
                };
                img.src = imageUrl;
            } catch (error) {
                console.error('圖片載入錯誤:', error);
            }
        }

        // 更新日誌
        function updateLogs(logs) {
            const logsContent = document.getElementById('logs-content');
            
            // 只保留最近的日誌項目，避免太多累積
            const recentLogs = logs.slice(-50);
            
            logsContent.innerHTML = recentLogs.map(log => {
                let className = 'log-entry';
                if (log.includes('✅') || log.includes('成功')) className += ' log-success';
                else if (log.includes('❌') || log.includes('錯誤')) className += ' log-error';
                else if (log.includes('⚠️') || log.includes('警告')) className += ' log-warning';
                
                return `<div class="${className}">
                    <span class="log-timestamp">[${new Date().toLocaleTimeString()}]</span> 
                    ${log}
                </div>`;
            }).join('');
            
            // 自動滾動到底部
            logsContent.scrollTop = logsContent.scrollHeight;
        }

        // 添加日誌項目
        function addLogEntry(message, type = 'info') {
            const logsContent = document.getElementById('logs-content');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `
                <span class="log-timestamp">[${new Date().toLocaleTimeString()}]</span> 
                ${message}
            `;
            logsContent.appendChild(logEntry);
            logsContent.scrollTop = logsContent.scrollHeight;
        }

        // 更新結果列表
        function updateResultsList(results) {
            const resultsList = document.getElementById('results-list');
            const resultsCount = document.getElementById('results-count');
            
            resultsCount.textContent = `${results.length} 項目`;
            
            resultsList.innerHTML = results.map((result, index) => {
                const isSelected = selectedResult && selectedResult.file_name === result.file_name;
                const categoryBadge = getCategoryBadge(result.category);
                
                return `
                    <div class="result-item ${isSelected ? 'selected' : ''}" 
                         onclick="selectResult(${index})">
                        <div class="result-filename">${result.file_name}</div>
                        <div class="result-data">
                            <span>${categoryBadge}</span>
                            <span>${result.model || '-'}</span>
                            <span>${result.price || '-'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 獲取分類標章
        function getCategoryBadge(category) {
            const badgeMap = {
                '單機': '<span class="result-badge badge-single">單機</span>',
                '遠景': '<span class="result-badge badge-distant">遠景</span>',
                '失敗': '<span class="result-badge badge-failed">失敗</span>',
                '不合格': '<span class="result-badge badge-failed">不合格</span>'
            };
            return badgeMap[category] || `<span class="result-badge">${category}</span>`;
        }

        // 選擇結果
        function selectResult(index) {
            if (!currentData?.recent_results) return;
            
            selectedResult = currentData.recent_results[index];
            updateResultsList(currentData.recent_results);
            updateCurrentImage(selectedResult.file_name);
            loadImagePreview(selectedResult.file_name);
            
            // 填充審核欄位
            document.getElementById('review-category').value = selectedResult.category || '單機';
            document.getElementById('review-model').value = selectedResult.model || '';
            document.getElementById('review-price').value = selectedResult.price || '';
            document.getElementById('review-blackscreen').value = selectedResult.black_screen ? 'true' : 'false';
            
            addLogEntry(`選擇了圖片: ${selectedResult.file_name}`, 'info');
        }

        // 提交修正
        async function submitCorrection() {
            if (!selectedResult) {
                alert('請先選擇要修正的圖片');
                return;
            }
            
            const correctionData = {
                filename: selectedResult.file_name,
                category: document.getElementById('review-category').value,
                model: document.getElementById('review-model').value,
                price: document.getElementById('review-price').value,
                black_screen: document.getElementById('review-blackscreen').value === 'true'
            };
            
            try {
                const response = await fetch('http://localhost:5000/api/correct', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(correctionData)
                });
                
                if (response.ok) {
                    addLogEntry(`✅ 修正已提交: ${correctionData.filename}`, 'success');
                    fetchData(); // 刷新資料
                } else {
                    throw new Error(`提交失敗: ${response.status}`);
                }
            } catch (error) {
                addLogEntry(`❌ 修正提交失敗: ${error.message}`, 'error');
            }
        }

        // 接受結果
        async function acceptResult() {
            if (!selectedResult) {
                alert('請先選擇要接受的結果');
                return;
            }
            
            addLogEntry(`👍 接受結果: ${selectedResult.file_name}`, 'success');
            // 可以在這裡添加 API 調用來標記結果為已接受
        }

        // 跳過圖片
        async function skipImage() {
            if (!selectedResult) {
                alert('請先選擇要跳過的圖片');
                return;
            }
            
            addLogEntry(`⏭️ 跳過圖片: ${selectedResult.file_name}`, 'warning');
            // 可以在這裡添加 API 調用來跳過圖片
        }

        // 刷新資料
        function refreshData() {
            addLogEntry('🔄 手動刷新資料...', 'info');
            fetchData();
        }
    </script>
</body>
</html>
